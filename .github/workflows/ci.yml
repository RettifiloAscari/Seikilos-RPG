name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Superseded runs on the same branch are pointless; cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run assets:check

  smoke:
    name: Play the standalone build in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium only; the other engines would triple the download for no gain.
      - run: npx playwright install --with-deps chromium

      - run: npm run build:single

      # Driving the real release artifact over file:// is the closest thing to
      # what somebody who downloads it will actually experience.
      - name: Smoke test seikilos.html
        env:
          SMOKE_URL: file://${{ github.workspace }}/dist-release/seikilos.html
          SMOKE_OUT: shots
        run: npm run smoke

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: shots/
          retention-days: 7
