name: Deploy playable build

# Publishes the game to GitHub Pages so it can be played from a link, with no
# clone and no install.
#
# ONE-TIME SETUP: Settings -> Pages -> Source: GitHub Actions.
#
# This cannot be automated. `configure-pages` has an `enablement` input, but
# the default GITHUB_TOKEN is not permitted to create a Pages site ("Resource
# not accessible by integration"), so it fails with a less obvious error than
# the one you get by leaving it off. Until Pages is switched on by hand this
# workflow will fail on "Get Pages site failed", which says what to do.

on:
  push:
    branches:
      - main
      - claude/jrpg-game-dev-ajy25f
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run should not overwrite a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
