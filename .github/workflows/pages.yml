name: Deploy playable build

# Publishes the game to GitHub Pages so it can be played from a link, with no
# clone and no install.
#
# `enablement: true` below asks the API to turn Pages on, so no manual setup
# should be needed. If the run still fails on "Get Pages site failed", the
# token was not allowed to enable it — switch it on by hand under
# Settings -> Pages -> Source: GitHub Actions, and re-run.

on:
  push:
    branches:
      - main
      - claude/jrpg-game-dev-ajy25f
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run should not overwrite a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
